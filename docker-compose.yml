services:
  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/bishal189/orivon_admin_dashboard:latest}
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: orivon-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3002}:80"
